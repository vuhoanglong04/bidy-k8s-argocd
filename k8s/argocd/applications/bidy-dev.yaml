apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bidy-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:vuhoanglong04/bidy-k8s-argocd.git
    targetRevision: dev
    path: k8s/apps/bidy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: bidy-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
