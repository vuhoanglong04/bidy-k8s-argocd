kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true        # để cài Cilium (NetworkPolicy có hiệu lực)
nodes:
  - role: control-plane
    extraPortMappings:           # đưa cổng 80/443 của máy vào cluster
      - { containerPort: 80,  hostPort: 80 }
      - { containerPort: 443, hostPort: 443 }
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
