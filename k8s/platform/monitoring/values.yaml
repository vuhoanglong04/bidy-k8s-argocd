# kube-prometheus-stack sized for a 12 GB kind cluster. Grafana: http://grafana.localtest.me
# (admin password: kubectl -n monitoring get secret monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d)
fullnameOverride: monitoring

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: longprovip2508@gmail.com
      smtp_auth_username: longprovip2508@gmail.com
      # Gmail app password, mounted from the alertmanager-smtp Secret (Vault -> ESO)
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp_password
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # only our own rules (extras/bidy-rules.yaml) send email; the chart's ~100 default
        # alerts stay visible in the UI but do not fill the inbox
        - receiver: email
          matchers: ['alertname=~"Bidy.*|Postgres.*"']
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: longvulinhhoang@gmail.com
            send_resolved: true
  alertmanagerSpec:
    secrets: [alertmanager-smtp]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 96Mi }

# kind runs these on the control-plane bound to localhost, so scraping them only produces false alerts.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false } # Cilium replaces kube-proxy

prometheus:
  prometheusSpec:
    retention: 3d
    # pick up ServiceMonitors/PodMonitors/PrometheusRules from any namespace, not just this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { cpu: 700m, memory: 900Mi }

grafana:
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
  defaultDashboardsTimezone: Asia/Ho_Chi_Minh
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localtest.me]
    path: /
  # Grafana needs a lot of CPU while it initialises (about 2 min at 300m); a low limit makes the
  # default liveness probe kill it before it ever listens.
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  livenessProbe:
    httpGet: { path: /api/health, port: grafana }
    initialDelaySeconds: 90
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 30

prometheusOperator:
  # The webhook's CA is injected by a Helm hook Job; under Argo CD that job is easy to miss and
  # leaves an empty caBundle, which then rejects every Prometheus/PrometheusRule write.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 192Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { cpu: 150m, memory: 128Mi }

prometheus-node-exporter:
  # Traefik is hostNetwork and already listens on 9100 (its metrics port) on the control-plane node.
  service:
    port: 9101
    targetPort: 9101
  tolerations:
    - {
        key: node-role.kubernetes.io/control-plane,
        operator: Exists,
        effect: NoSchedule,
      }
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { cpu: 100m, memory: 64Mi }
