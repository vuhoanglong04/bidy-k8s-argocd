# Alertmanager's SMTP password comes from Vault (secret/monitoring/alertmanager, key smtp_password)
# through External Secrets Operator. ESO logs in with the eso-vault ServiceAccount (Vault role
# "monitoring", read-only on that one path). Alertmanager mounts the resulting Secret and reads
# the password from a file (smtp_auth_password_file in values.yaml), so it never appears in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring
          serviceAccountRef:
            name: eso-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/alertmanager
