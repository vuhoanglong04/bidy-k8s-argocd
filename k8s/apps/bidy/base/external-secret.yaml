# Secrets come from Vault (secret/bidy/dev) through External Secrets Operator.
# ESO logs in to Vault with the eso-vault ServiceAccount (Vault role "bidy-dev", read-only
# on that one path) and keeps a Kubernetes Secret in sync.
# The Secret is called bidy-secret so the Deployments, migrate Job and backup CronJob read it
# unchanged. Rotate a value with `vault kv patch secret/bidy/dev KEY=value`, then restart the
# pods (they only read env vars at start).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: bidy-dev
  labels:
    app.kubernetes.io/part-of: bidy
  annotations:
    # must exist before the SecretStore (wave -1) is applied, or the store never becomes
    # Healthy and Argo CD waits on it forever
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # the ESO CRDs come from another Application and may not exist on the first sync
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bidy-dev
          serviceAccountRef:
            name: eso-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bidy-secret
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: bidy-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: bidy/dev
