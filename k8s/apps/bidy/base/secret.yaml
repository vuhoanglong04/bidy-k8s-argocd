# PLACEHOLDER VALUES ONLY, so the stack boots on a local cluster.
# Never commit real credentials here: replace this file with a SealedSecret
# (platform/sealed-secrets) and keep only the encrypted output in Git.
apiVersion: v1
kind: Secret
metadata:
  name: bidy-secret
  namespace: bidy-dev
  labels:
    app.kubernetes.io/part-of: bidy
type: Opaque
stringData:
  POSTGRES_PASSWORD: dev-postgres-password
  REDIS_PASSWORD: dev-redis-password

  # JWT secrets must be >= 32 chars and different from each other
  JWT_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
  JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-0123456789abcdef

  ACCESS_KEY_ID: CHANGE_ME
  SECRET_ACCESS_KEY: CHANGE_ME
  SEPAY_API_KEY: CHANGE_ME
  SEPAY_WEBHOOK_SECRET: CHANGE_ME
  MAIL_PASSWORD: CHANGE_ME
  ADMIN_PASSWORD: Password123!
