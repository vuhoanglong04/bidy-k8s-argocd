---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bidy-secret
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    ACCESS_KEY_ID: 
    ADMIN_PASSWORD: 
    JWT_REFRESH_SECRET: 
    JWT_SECRET: 
    MAIL_PASSWORD: 
    POSTGRES_PASSWORD: 
    R2_ENDPOINT: 
    REDIS_PASSWORD: 
    SECRET_ACCESS_KEY: 
    SEPAY_API_KEY: 
    SEPAY_WEBHOOK_SECRET: 
  template:
    metadata:
      name: bidy-secret
      namespace: bidy-dev
    type: Opaque
