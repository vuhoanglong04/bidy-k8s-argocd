# Daily logical backup: pg_dump (custom format) -> Cloudflare R2 under backups/postgres/.
# Step 1 dumps to an emptyDir, step 2 uploads with rclone and prunes copies older than 7 days.
# Restore drill: see k8s/docs/restore-postgres.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: bidy-dev
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: bidy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: bidy
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /backup/dump.pgdump
                  ls -l /backup
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef: { name: bidy-config, key: POSTGRES_USER }
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef: { name: bidy-config, key: POSTGRES_DB }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: bidy-secret, key: POSTGRES_PASSWORD }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - { name: backup, mountPath: /backup }
          containers:
            - name: upload
              image: rclone/rclone:1.68.2
              command:
                - sh
                - -c
                - |
                  set -e
                  # bidy-secret's R2_ENDPOINT ends with /<bucket> (the app's SDK wants that);
                  # rclone needs the bare host or objects land under <bucket>/<bucket>/.
                  export RCLONE_CONFIG_R2_ENDPOINT=$(echo "$R2_ENDPOINT" | sed -E 's#(https://[^/]+).*#\1#')
                  dest="r2:${BUCKET_NAME}/backups/postgres"
                  name="bidy_db-$(date -u +%Y%m%dT%H%M%SZ).pgdump"
                  rclone copyto /backup/dump.pgdump "$dest/$name"
                  rclone delete "$dest" --min-age 7d
                  rclone lsl "$dest"
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG_R2_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_R2_PROVIDER, value: Cloudflare }
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: bidy-secret, key: R2_ENDPOINT }
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: bidy-secret, key: ACCESS_KEY_ID }
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: bidy-secret, key: SECRET_ACCESS_KEY }
                - name: BUCKET_NAME
                  valueFrom:
                    configMapKeyRef: { name: bidy-config, key: BUCKET_NAME }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 300m, memory: 192Mi }
              volumeMounts:
                - { name: backup, mountPath: /backup }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
