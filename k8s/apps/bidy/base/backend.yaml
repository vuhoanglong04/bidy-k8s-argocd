apiVersion: v1
kind: Service
metadata:
  name: bidy-backend
  namespace: bidy-dev
  labels:
    app.kubernetes.io/name: bidy-backend
    app.kubernetes.io/part-of: bidy
spec:
  selector:
    app.kubernetes.io/name: bidy-backend
  ports:
    - name: http
      port: 8001
      targetPort: http
---
# API instances (HTTP + Socket.IO). Cron stays off here so it never runs
# duplicated across replicas: see worker.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidy-backend
  namespace: bidy-dev
  labels:
    app.kubernetes.io/name: bidy-backend
    app.kubernetes.io/part-of: bidy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bidy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bidy-backend
        app.kubernetes.io/part-of: bidy
    spec:
      containers:
        - name: backend
          image: longvulinhhoang/bidy-be:dev
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: bidy-config
            - secretRef:
                name: bidy-secret
          env:
            - name: ENABLE_CRON
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
