# Zero-trust for the bidy-dev namespace: deny everything, then allow only the flows below.
#   internet -> Traefik -> frontend / backend      (Cilium policy: Traefik is hostNetwork)
#   backend, worker, migrate -> postgres, redis, external HTTPS/SMTP (R2, mail, SePay)
#   everything -> kube-dns
# kubelet probes come from the node itself, which Cilium always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bidy-backend, bidy-worker, bidy-migrate, postgres-backup]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    # R2 (443), SMTP (465/587)
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 587 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bidy-backend, bidy-worker, bidy-migrate, postgres-backup]
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [bidy-backend, bidy-worker, bidy-migrate]
      ports:
        - { protocol: TCP, port: 6379 }
---
# Traefik runs with hostNetwork, so its traffic arrives as the "host"/"remote-node"
# entity (depending on which node the target pod is on). Plain NetworkPolicy cannot
# express that, hence CiliumNetworkPolicy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress-from-traefik
  namespace: bidy-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [bidy-frontend, bidy-backend]
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "3001", protocol: TCP }
            - { port: "8001", protocol: TCP }
