worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # bidy-frontend lives in a separate compose stack (bidy-fe repo) on the
  # same external network, so it may not be up yet when this container
  # starts. Resolve it lazily via Docker's embedded DNS instead of a static
  # upstream block, so nginx doesn't refuse to start if it's briefly down.
  resolver 127.0.0.11 valid=10s;

  # Common reverse-proxy headers, incl. WebSocket upgrade (socket.io on the
  # backend, and Next.js dev/HMR sockets on the frontend).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # --- Backend API routes ---------------------------------------------
    # NOTE: the backend also exposes a bare "/admin" router (core admin API),
    # which collides with the frontend's own protected "/admin/:path*" pages.
    # Left unrouted here on purpose — proxy it separately (e.g. a distinct
    # host/port) if you need it reachable through this nginx.
    location /api/ {
      set $backend_upstream bidy-backend:8001;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs/ {
      set $backend_upstream bidy-backend:8001;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
    }

    # /user/, /auction/, /chat/, /images/ bare prefixes were removed: the backend
    # doesn't mount anything under them (everything lives under /api/v1/...), so
    # they only ever collided with the frontend's own pages at those paths (e.g.
    # /auction/new) and misrouted them into the backend as 404s.

    location /health {
      set $backend_upstream bidy-backend:8001;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
    }

    # socket.io realtime channel (bidding/chat)
    location /socket.io/ {
      set $backend_upstream bidy-backend:8001;
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else -> frontend ------------------------------------
    location / {
      set $frontend_upstream bidy-frontend:3001;
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
