name: CI/CD (dev) - bidy-be

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: cicd-dev-be-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  IMAGE_NAME: bidy-be

jobs:
  ci:
    name: Lint & test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      # src/tests/run-checks.ts spawns every *.check.ts in its own tsx process.
      # .env is committed to the repo, so dotenv picks it up automatically.
      - run: npm test

  cd:
    name: Build, push & update GitOps
    needs: ci
    # Only deploy from dev; PRs just run CI.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is included so the image runs on a local kind cluster on Apple Silicon.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Argo CD watches the GitOps repo; bumping the image tag there triggers the rollout.
      # Required: secret GITOPS_TOKEN (PAT / fine-grained token with contents:write on the GitOps repo)
      #           variable GITOPS_REPO (e.g. "<owner>/bidy-gitops")
      # Optional: variable GITOPS_DEV_PATH_BE (default: apps/bidy/overlays/dev)
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump image tag
        working-directory: gitops/${{ vars.GITOPS_DEV_PATH_BE || 'apps/bidy/overlays/dev' }}
        run: |
          kustomize edit set image \
            "${{ steps.meta.outputs.image }}=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Commit & push
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore(dev): bidy-be -> ${{ steps.meta.outputs.tag }}"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
