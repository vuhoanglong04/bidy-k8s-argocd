name: CI/CD (dev) - bidy-fe

on:
  push:
    branches: [dev]
    paths:
      - 'bidy-fe/**'
      - '.github/workflows/cicd-dev-fe.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'bidy-fe/**'
      - '.github/workflows/cicd-dev-fe.yml'
  workflow_dispatch:

concurrency:
  group: cicd-dev-fe-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  IMAGE_NAME: bidy-fe

jobs:
  ci:
    name: Lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bidy-fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bidy-fe/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: bidy-fe/coverage/
          retention-days: 7
          if-no-files-found: ignore

  cd:
    name: Build & push image
    needs: ci
    # Only deploy from dev; PRs just run CI.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write # commits the new image tag back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref
        id: meta
        run: |
          echo "image=${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
      # must be build args. Set them as repository/environment *variables*
      # (Settings > Secrets and variables > Actions > Variables); defaults below
      # target the local kind cluster.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./bidy-fe
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image }}:scan
          cache-from: type=gha,scope=fe
          cache-to: type=gha,scope=fe,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Bidy' }}
            NEXT_PUBLIC_APP_DESCRIPTION=${{ vars.NEXT_PUBLIC_APP_DESCRIPTION || 'Vietnamese Online Auction Platform' }}
            NEXT_PUBLIC_MAX_IMAGE_SIZE=${{ vars.NEXT_PUBLIC_MAX_IMAGE_SIZE || '10485760' }}
            NEXT_PUBLIC_SUPPORTED_FORMATS=${{ vars.NEXT_PUBLIC_SUPPORTED_FORMATS || 'jpeg,jpg,png,webp' }}
            NEXT_PUBLIC_DEFAULT_PAGE_SIZE=${{ vars.NEXT_PUBLIC_DEFAULT_PAGE_SIZE || '12' }}
            NEXT_PUBLIC_ADMIN_PAGE_SIZE=${{ vars.NEXT_PUBLIC_ADMIN_PAGE_SIZE || '10' }}
            NEXT_PUBLIC_ENABLE_CHAT=${{ vars.NEXT_PUBLIC_ENABLE_CHAT || 'true' }}
            NEXT_PUBLIC_ENABLE_NOTIFICATIONS=${{ vars.NEXT_PUBLIC_ENABLE_NOTIFICATIONS || 'true' }}
            NEXT_PUBLIC_ENABLE_DARK_MODE=${{ vars.NEXT_PUBLIC_ENABLE_DARK_MODE || 'true' }}
            NEXT_PUBLIC_SHOW_DEV_TOOLS=${{ vars.NEXT_PUBLIC_SHOW_DEV_TOOLS || 'false' }}
            NEXT_PUBLIC_ENABLE_DEBUG=${{ vars.NEXT_PUBLIC_ENABLE_DEBUG || 'false' }}
            NEXT_PUBLIC_LOG_LEVEL=${{ vars.NEXT_PUBLIC_LOG_LEVEL || 'INFO' }}

      - name: Trivy scan (report, all severities)
        run: |
          mkdir -p trivy-out "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/trivy-out:/out" \
            aquasec/trivy:0.57.1 image \
              --format json --output /out/trivy-report.json --exit-code 0 \
              "${{ steps.meta.outputs.image }}:scan"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-fe
          path: trivy-out/trivy-report.json
          retention-days: 14
          if-no-files-found: ignore

      # Fails the job (and so skips the push below) on any HIGH or CRITICAL finding.
      - name: Trivy gate (HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.57.1 image \
              --severity HIGH,CRITICAL --exit-code 1 \
              "${{ steps.meta.outputs.image }}:scan"

      # Only reached if the scan gate passed. arm64 is included so the image runs on a local kind cluster on Apple Silicon.
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./bidy-fe
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:dev
          cache-from: type=gha,scope=fe
          cache-to: type=gha,scope=fe,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://bidy.localtest.me' }}
            NEXT_PUBLIC_APP_NAME=${{ vars.NEXT_PUBLIC_APP_NAME || 'Bidy' }}
            NEXT_PUBLIC_APP_DESCRIPTION=${{ vars.NEXT_PUBLIC_APP_DESCRIPTION || 'Vietnamese Online Auction Platform' }}
            NEXT_PUBLIC_MAX_IMAGE_SIZE=${{ vars.NEXT_PUBLIC_MAX_IMAGE_SIZE || '10485760' }}
            NEXT_PUBLIC_SUPPORTED_FORMATS=${{ vars.NEXT_PUBLIC_SUPPORTED_FORMATS || 'jpeg,jpg,png,webp' }}
            NEXT_PUBLIC_DEFAULT_PAGE_SIZE=${{ vars.NEXT_PUBLIC_DEFAULT_PAGE_SIZE || '12' }}
            NEXT_PUBLIC_ADMIN_PAGE_SIZE=${{ vars.NEXT_PUBLIC_ADMIN_PAGE_SIZE || '10' }}
            NEXT_PUBLIC_ENABLE_CHAT=${{ vars.NEXT_PUBLIC_ENABLE_CHAT || 'true' }}
            NEXT_PUBLIC_ENABLE_NOTIFICATIONS=${{ vars.NEXT_PUBLIC_ENABLE_NOTIFICATIONS || 'true' }}
            NEXT_PUBLIC_ENABLE_DARK_MODE=${{ vars.NEXT_PUBLIC_ENABLE_DARK_MODE || 'true' }}
            NEXT_PUBLIC_SHOW_DEV_TOOLS=${{ vars.NEXT_PUBLIC_SHOW_DEV_TOOLS || 'false' }}
            NEXT_PUBLIC_ENABLE_DEBUG=${{ vars.NEXT_PUBLIC_ENABLE_DEBUG || 'false' }}
            NEXT_PUBLIC_LOG_LEVEL=${{ vars.NEXT_PUBLIC_LOG_LEVEL || 'INFO' }}

      # Argo CD watches k8s/apps/bidy/overlays/dev: changing the tag there is what
      # triggers the rollout. Only k8s/** changes, which this workflow's path filter
      # ignores, and GITHUB_TOKEN pushes don't start new workflow runs anyway.
      - name: Bump image tag in overlay
        run: |
          yq -i '(.images[] | select(.name == "${{ steps.meta.outputs.image }}") | .newTag) = "${{ steps.meta.outputs.tag }}"' \
            k8s/apps/bidy/overlays/dev/kustomization.yaml

      - name: Commit and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/bidy/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag already up to date"; exit 0
          fi
          git commit -m "chore(dev): bidy-fe -> ${{ steps.meta.outputs.tag }}"
          # BE and FE pipelines can finish at the same time: rebase onto whatever landed first
          git pull --rebase origin dev
          git push origin HEAD:dev
